document_id: sdcep_anticoagulants_antiplatelet_2022

title: Management of Dental Patients Taking Anticoagulants or Antiplatelet Drugs

source:
  organization: Scottish Dental Clinical Effectiveness Programme
  edition: Second Edition
  publication_year: 2022
  isbn: "978-1-905829-36-1"
  website: "https://www.sdcep.org.uk"


procedure_assessment_rules:

  tooth_extraction:

    missing_information_result:
      procedure_type: tooth_extraction
      classification_status: needs_clinician_confirmation
      procedure_category: ""
      postoperative_bleeding_risk: ""

    rules:

      - rule_id: complex_or_surgical_extraction

        extraction_complexity:
          - complex
          - surgical

        result:
          procedure_type: tooth_extraction
          classification_status: classified
          procedure_category: higher_risk_extraction
          postoperative_bleeding_risk: higher

      - rule_id: more_than_three_extractions

        minimum_teeth: 4

        result:
          procedure_type: tooth_extraction
          classification_status: classified
          procedure_category: more_than_3_extractions_at_once
          postoperative_bleeding_risk: higher

      - rule_id: simple_extraction_one_to_three_teeth

        extraction_complexity:
          - simple

        minimum_teeth: 1
        maximum_teeth: 3

        wound_size:
          - restricted

        result:
          procedure_type: tooth_extraction
          classification_status: classified
          procedure_category: simple_extraction_1_to_3_teeth_with_restricted_wound_size
          postoperative_bleeding_risk: low

      - rule_id: adjacent_extractions_causing_large_wound

        extraction_complexity:
        - simple

        wound_size:
        - large

        whether_extractions_are_adjacent:
        - "yes"

        result:
          procedure_type: tooth_extraction
          classification_status: classified
          procedure_category: adjacent_extractions_causing_large_wound
          postoperative_bleeding_risk: higher
          missing_information: [ ]

    no_matching_rule_result:
      procedure_type: tooth_extraction
      classification_status: requires_clinician_review
      procedure_category: ""
      postoperative_bleeding_risk: ""
      missing_information: []

  incision_and_drainage_of_intraoral_swellings:

    result:
      procedure_type: incision_and_drainage_of_intraoral_swellings
      classification_status: classified
      procedure_category: incision_and_drainage_of_intraoral_swellings
      postoperative_bleeding_risk: low
      missing_information: [ ]


  detailed_six_point_full_periodontal_examination:

    result:
      procedure_type: detailed_six_point_full_periodontal_examination
      classification_status: classified
      procedure_category: detailed_six_point_full_periodontal_examination
      postoperative_bleeding_risk: low
      missing_information: [ ]


  root_surface_debridement:

    result:
      procedure_type: root_surface_debridement
      classification_status: classified
      procedure_category: root_surface_debridement
      postoperative_bleeding_risk: low
      missing_information: [ ]


  direct_or_indirect_restorations_with_subgingival_margins:

    result:
      procedure_type: direct_or_indirect_restorations_with_subgingival_margins
      classification_status: classified
      procedure_category: restoration_with_subgingival_margins
      postoperative_bleeding_risk: low
      missing_information: [ ]


  periodontal_surgery:

    result:
      procedure_type: periodontal_surgery
