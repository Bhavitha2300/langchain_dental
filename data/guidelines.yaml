  # ============================================================
  # INDICATIONS FOR ANTICOAGULANT OR ANTIPLATELET THERAPY
  # Appendix 3 explicitly states this list is not comprehensive.
  # ============================================================

  - aspect: indications_for_anticoagulant_or_antiplatelet_therapy
    title: Indications for Anticoagulant or Antiplatelet Therapy

    subsections:

      - subaspect: appendix_3_scope
        title: Scope of Indication Information
        source_section: "Appendix 3"
        record_type: background_information

        content: |
          The list of indications in Appendix 3 is not comprehensive.

          It is intended as a guide to reflect current use of these drugs in
          the UK population at the time of publication.

          Conditions for which newer drugs are licensed are subject to change.

      - subaspect: stroke_or_tia_without_atrial_fibrillation
        title: Stroke or TIA in the Absence of Atrial Fibrillation
        source_section: "Appendix 3"
        record_type: indication_information

        conditions:
          - stroke_or_transient_ischaemic_attack_without_atrial_fibrillation

        commonly_used_treatments:
          - single_antiplatelet
          - dual_antiplatelet

        commonly_used_medications:
          - clopidogrel

        treatment_duration: lifelong

        content: |
          For stroke or transient ischaemic attack in the absence of atrial
          fibrillation, Appendix 3 lists single or dual antiplatelet therapy,
          often clopidogrel, as commonly used treatment.

          Warfarin is used occasionally.

      - subaspect: atrial_fibrillation
        title: Stroke Prevention in Patients With Atrial Fibrillation
        source_section: "Appendix 3"
        record_type: indication_information

        conditions:
          - atrial_fibrillation

        commonly_used_treatments:
          - doac

        treatment_duration: lifelong

        content: |
          For stroke prevention in patients with atrial fibrillation,
          Appendix 3 lists a DOAC as commonly used treatment.

          Warfarin is used occasionally and single or dual antiplatelet
          therapy is used rarely.

      - subaspect: dvt_and_pulmonary_embolism
        title: Thromboembolic Disease Including DVT and Pulmonary Embolism
        source_section: "Appendix 3"
        record_type: indication_information

        conditions:
          - deep_vein_thrombosis
          - pulmonary_embolism

        commonly_used_treatments:
          - doac
          - warfarin
          - injectable_anticoagulant

        content: |
          For thromboembolic disease including deep vein thrombosis and
          pulmonary embolism, Appendix 3 lists DOACs, warfarin or injectable
          anticoagulants as commonly used treatments.

          Treatment is usually 6 weeks to 6 months.

          Prophylaxis can be lifelong.

          Treatment can be lifelong in cases of recurrence or an ongoing
          untreatable risk factor such as malignancy.

      - subaspect: recent_significant_surgery
        title: Recent Significant Surgery
        source_section: "Appendix 3"
        record_type: indication_information

        clinical_contexts:
        - recent_significant_surgery

        commonly_used_treatments:
        - injectable_anticoagulant
        - doac
        - doac_with_aspirin

        treatment_duration: usually_2_to_6_weeks

        content: |
          Following recent significant surgery, Appendix 3 lists an injectable
          anticoagulant or a DOAC, with or without aspirin, as commonly used
          treatment. Treatment is usually continued for 2 to 6 weeks.
          
      - subaspect: heart_surgery_or_prosthetic_heart_valve
        title: Heart Surgery or Prosthetic Replacement Heart Valve
        source_section: "Appendix 3"
        record_type: indication_information

        clinical_contexts:
        - heart_surgery
        - prosthetic_replacement_heart_valve

        commonly_used_treatments:
        - vitamin_k_antagonist
        - single_antiplatelet

        treatment_duration: long_term

        content: |
            Following heart surgery, especially prosthetic replacement heart-valve
            surgery, Appendix 3 lists warfarin or another vitamin K antagonist, or
            single antiplatelet therapy, as commonly used long-term treatment.

            Warfarin or a similar medicine is used for mechanical valves. Aspirin
            may be used for some tissue valves. A DOAC is used occasionally and
            may be used with or without aspirin for a tissue valve with atrial
            fibrillation.
          
      - subaspect: coronary_heart_disease
        title: Coronary Heart Disease
        source_section: "Appendix 3"
        record_type: indication_information

        conditions:
          - stable_angina
          - unstable_angina
          - myocardial_infarction

        commonly_used_treatments:
        - single_antiplatelet
        - dual_antiplatelet
        - doac_with_antiplatelet

        content: |
          Appendix 3 lists antiplatelet therapy for coronary heart disease,
          including stable angina, unstable angina and myocardial infarction.

          Dual antiplatelet therapy may be used for 6 to 12 months following
          angioplasty, stent insertion or myocardial infarction, followed by
          single therapy with aspirin or clopidogrel.

          A DOAC may be combined with single or dual antiplatelet therapy after
          a recent myocardial infarction in a patient with atrial fibrillation.

      - subaspect: coronary_stent_indication
        title: Coronary Stent
        source_section: "Appendix 3"
        record_type: indication_information

        clinical_contexts:
          - coronary_stent

        commonly_used_treatments:
          - single_antiplatelet
          - dual_antiplatelet

        content: |
          For coronary stents, Appendix 3 lists single or dual antiplatelet
          therapy.

          Dual therapy may be used for up to 12 months, followed by
          lifelong monotherapy.

      - subaspect: kidney_failure_requiring_dialysis
        title: Kidney Failure Requiring Dialysis
        source_section: "Appendix 3"
        record_type: indication_information

        conditions:
          - kidney_failure_requiring_dialysis

        commonly_used_treatments:
          - heparin
          - injectable_anticoagulant

        treatment_duration: on_day_of_dialysis

        content: |
          Appendix 3 lists heparin or injectable anticoagulants for kidney
          failure requiring dialysis, used on the day of dialysis.

      - subaspect: pregnancy_with_vte_risk_factors
        title: Pregnancy With Associated Risk Factors for Venous Thromboembolism
        source_section: "Appendix 3"
        record_type: indication_information

        treatment_duration: until_delivery_or_six_weeks_after_delivery_for_obesity

        clinical_contexts:
          - pregnancy_with_vte_risk_factors

        commonly_used_treatments:
          - aspirin
          - injectable_anticoagulant

        content: |
          Appendix 3 lists aspirin, or injectable anticoagulants in some
          high-risk cases, for pregnancy with associated risk factors for
          venous thromboembolism.

      - subaspect: dvt_in_pregnancy
        title: Treatment of DVT in Pregnancy
        source_section: "Appendix 3"
        record_type: indication_information

        treatment_duration: at_least_six_weeks_after_delivery_and_at_least_three_months_total

        conditions:
          - deep_vein_thrombosis
        clinical_contexts:
          - pregnancy

        commonly_used_treatments:
          - injectable_anticoagulant

        content: |
          Appendix 3 lists injectable anticoagulant treatment for DVT in
          pregnancy.
          
          Treatment continues until at least six weeks after delivery and
          for at least three months in total.

      - subaspect: peripheral_vascular_disease
        title: Peripheral Vascular or Peripheral Arterial Disease
        source_section: "Appendix 3"
        record_type: indication_information

        conditions:
          - peripheral_vascular_disease
          - peripheral_arterial_disease

        commonly_used_treatments:
          - single_antiplatelet
          - dual_antiplatelet
          - rivaroxaban_with_aspirin

        treatment_duration: lifelong

        content: |
            Appendix 3 lists single or dual antiplatelet therapy, or rivaroxaban
            with aspirin, for peripheral vascular or peripheral arterial disease.

      - subaspect: apical_ventricular_mural_thrombus
        title: Apical, Ventricular or Mural Thrombus
        source_section: "Appendix 3"
        record_type: indication_information

        conditions:
          - apical_ventricular_or_mural_thrombus

        commonly_used_treatments:
          - warfarin

        content: |
          Appendix 3 lists warfarin for apical, ventricular or mural
          thrombus, generally for 6 to 12 months with review after
          echocardiography.

          Treatment may be combined with dual antiplatelet therapy after
          a recent heart attack.

          A DOAC is used occasionally.