[project]
name = "langchain-dental"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bhavitha Asam", email = "bhavithaasam@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.13",
    "langchain-openai>=1.3.5",
    "langchain-postgres>=0.0.17",
    "langchain-text-splitters>=1.1.2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[project.scripts]
langchain-dental = "langchain_dental:main"
simple-llm= "basics.a_llm:run"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
